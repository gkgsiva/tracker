name: Guide screenshots

# Builds the app, runs it on an emulator with the demo data in docs/screenshots/seed.csv and
# commits fresh screenshots for docs/user-guide.md back to the branch. Run it by hand from the
# Actions tab after a UI change, or push a change to the capture script.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/screenshots.yml
      - docs/screenshots/capture.sh
      - docs/screenshots/seed.csv

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash docs/screenshots/capture.sh
      - name: Shrink screenshots
        if: always()
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          import glob
          from PIL import Image
          for path in glob.glob("docs/screenshots/*.png"):
              im = Image.open(path).convert("RGB")
              im.thumbnail((540, 1400))
              im.quantize(colors=256, method=Image.Quantize.MEDIANCUT).save(path, optimize=True)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-screenshots
          path: |
            docs/screenshots/*.png
            screenshot-debug/
      - name: Commit screenshots
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git diff --cached --quiet && exit 0
          git commit -m "Update user guide screenshots"
          git push
